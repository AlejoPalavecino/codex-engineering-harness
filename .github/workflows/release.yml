name: Publish validated Chuli profile

on:
  workflow_run:
    workflows: ["Validate harness"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_run:
        description: "Successful Validate harness push run on main"
        type: string
        required: true
      version:
        description: "Approved release version without v"
        type: string
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: chuli-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Verify workflow identity and the exact current main
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.validation_run }}
          # One-time automatic publication requested for v1.0.0.
          VERSION_APPROVED: ${{ inputs.version || '1.0.0' }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$VERSION_APPROVED" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")
          echo "$run" | jq -e --arg repo "$GITHUB_REPOSITORY" '.path == ".github/workflows/validate.yml" and .event == "push" and .head_branch == "main" and .conclusion == "success" and .head_repository.full_name == $repo'
          sha=$(jq -r .head_sha <<< "$run")
          head=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)
          [[ "$head" == "$sha" ]]
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" --jq .content | base64 -d | tr -d '\r\n')
          if [[ "$version" != "$VERSION_APPROVED" ]]; then
            [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]] && exit 0
            exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.approval.outputs.publish == 'true'
        with:
          ref: ${{ steps.approval.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: steps.approval.outputs.publish == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id || inputs.validation_run }}
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify files, tag and publish
        if: steps.approval.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.approval.outputs.version }}
          SHA: ${{ steps.approval.outputs.sha }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.validation_run }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          [[ "$(git rev-parse origin/main)" == "$SHA" ]]
          files=("chuli-profile-v${VERSION}.zip" "chuli_v${VERSION}_windows_amd64.zip" "chuli_v${VERSION}_linux_amd64.tar.gz" "chuli_v${VERSION}_darwin_arm64.tar.gz" "install-chuli-windows.ps1")
          (
            cd dist
            [[ "$(find . -type f | wc -l)" -eq 5 ]]
            for name in "${files[@]}"; do test -s "$name"; done
            unzip -tq "${files[0]}"
            [[ "$(unzip -p "${files[0]}" VERSION | tr -d '\r\n')" == "$VERSION" ]]
            [[ "$(unzip -Z1 "${files[1]}")" == "chuli.exe" ]]
            for name in "${files[@]:2:2}"; do [[ "$(tar -tzf "$name")" == "chuli" ]]; done
            cmp "${files[4]}" ../scripts/install-manager.ps1
            sha256sum "${files[@]}" > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )
          if ! git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            git tag "v$VERSION" "$SHA"
            git push origin "refs/tags/v$VERSION"
          fi
          [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" == "$SHA" ]]
          notes="$RUNNER_TEMP/chuli-release.md"
          cp "docs/releases/v$VERSION.md" "$notes"
          echo >> "$notes"
          echo "Commit [$SHA](https://github.com/$GITHUB_REPOSITORY/commit/$SHA) · [CI de los artefactos](https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID)" >> "$notes"
          gh release create "v$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --verify-tag \
            --title "Chuli v$VERSION · Perfil personal para Codex" --notes-file "$notes" --latest
