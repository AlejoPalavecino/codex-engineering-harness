name: Publish validated v0.1.1

on:
  workflow_run:
    workflows: ["Validate harness"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-codex-harness-v0.1.1
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Publish only the verified current main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          sha=$(git rev-parse HEAD)
          current_main=$(git rev-parse origin/main)
          if [[ "$sha" != "$current_main" ]]; then
            echo "Not publishing an old main commit."
            exit 0
          fi
          version=$(tr -d '\r\n' < VERSION)
          if [[ "$version" != "0.1.1" ]]; then
            echo "This workflow only publishes v0.1.1; found $version"
            exit 0
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists."
            exit 0
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "Codex Engineering Harness v$version" \
            --notes-file "docs/releases/v$version.md" \
            --latest
