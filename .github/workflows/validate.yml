name: Validate harness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check review budget against the immediate PR base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          test "$(jq -r .head.sha <<< "$pr")" = "$SHA"
          count=$(jq '.additions + .deletions' <<< "$pr")
          echo "$count / 400 changed lines"
          test "$count" -le 400
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests, skills, and agents
        run: python tests/validate_repository.py
      - name: Validate TTP task-state transitions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate all project task boards
        run: |
          for board in odd/tasks/*.md; do python scripts/taskboard.py check "$board"; done
      - name: Package portable Codex profile
        run: python scripts/package_release.py profile dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-profile
          path: dist/chuli-profile-*.zip
          if-no-files-found: error
      - name: Check synthetic Python fixture tests
        shell: bash
        run: |
          (cd evals/fixtures/loans && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
          (cd evals/fixtures/importer && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1,tests/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Dry-run, install, verify, rollback and update
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Regression tests for TOML, personalization and rollback
        shell: pwsh
        run: ./tests/windows-regression.ps1
      - name: TTP resources installation, preservation and rollback
        shell: pwsh
        run: ./tests/windows-ttp-resources.ps1
      - name: TTP resources compatibility with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-ttp-resources.ps1

  chuli-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check pinned Go dependencies
        run: go mod tidy -diff
      - name: Check Go source formatting
        shell: bash
        run: |
          dirty=$(gofmt -l cmd/chuli internal/manager internal/tui internal/eval internal/integrations)
          if [[ -n "$dirty" ]]; then
            echo "$dirty"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Test Chuli
        run: go test ./...
      - name: Validate evaluation catalog from CLI
        run: go run ./cmd/chuli eval check
      - name: Check Python fixtures on every platform
        shell: bash
        run: |
          (cd evals/fixtures/loans && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
          (cd evals/fixtures/importer && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
      - name: Build, run and package native Chuli Manager
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          binary=chuli
          if [[ "$goos" == "windows" ]]; then binary=chuli.exe; fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-X main.version=$version" -o "$binary" ./cmd/chuli
          "./$binary" version | grep -F "$version"
          "./$binary" --source . eval check
          python scripts/package_release.py manager dist --binary "$binary" --goos "$goos" --goarch "$goarch"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manager-${{ runner.os }}
          path: dist/chuli_v*
          if-no-files-found: error
          retention-days: 14
