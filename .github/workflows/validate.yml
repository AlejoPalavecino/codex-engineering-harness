name: Validate harness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests, skills, and agents
        run: python tests/validate_repository.py
      - name: Validate TTP task-state transitions
        run: python -m unittest discover -s tests -p 'test_*.py'

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1,tests/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Dry-run, install, verify, rollback and update
        shell: pwsh
        run: ./tests/windows-smoke.ps1
