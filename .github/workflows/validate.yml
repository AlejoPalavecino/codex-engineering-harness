name: Validate harness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate manifests, skills, and agents
        run: python tests/validate_repository.py
      - name: Validate TTP task-state transitions
        run: python -m unittest discover -s tests -p 'test_*.py'

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1,tests/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Dry-run, install, verify, rollback and update
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Regression tests for TOML, personalization and rollback
        shell: pwsh
        run: ./tests/windows-regression.ps1

  chuli-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Resolve Go dependencies
        run: go mod tidy
      - name: Format and emit Go files (temporary review step)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          gofmt -w cmd/chuli/main.go internal/manager/manager.go internal/manager/manager_test.go internal/tui/tui.go
          for file in cmd/chuli/main.go internal/manager/manager.go internal/manager/manager_test.go internal/tui/tui.go; do
            printf "CHULI_FILE_BEGIN:%s\n" "$file"
            cat "$file"
            printf "CHULI_FILE_END:%s\n" "$file"
          done
      - name: Capture reproducible dependency checksums
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo CHULI_MOD_BEGIN
          cat go.mod
          echo CHULI_MOD_END
          echo CHULI_SUM_BEGIN
          cat go.sum
          echo CHULI_SUM_END
      - name: Test Chuli
        run: go test ./...
      - name: Build Chuli TUI
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            go build -o chuli.exe ./cmd/chuli
          else
            go build -o chuli ./cmd/chuli
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: chuli-${{ runner.os }}-${{ runner.arch }}
          path: |
            chuli
            chuli.exe
          if-no-files-found: error
          retention-days: 14
