name: Validate harness

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check review budget against the immediate PR base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          test "$(jq -r .head.sha <<< "$pr")" = "$SHA"
          count=$(jq '.additions + .deletions' <<< "$pr")
          echo "$count / 400 changed lines"
          test "$count" -le 400
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate manifests, skills, and agents
        run: python tests/validate_repository.py
      - name: Validate TTP task-state transitions
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate all project task boards
        run: |
          for board in odd/tasks/*.md; do python scripts/taskboard.py check "$board"; done
      - name: Package portable Codex profile
        run: python scripts/package_release.py profile dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-part-profile
          path: dist/chuli-profile-*.zip
          if-no-files-found: error
          overwrite: true
      - name: Package standalone Windows installer
        run: python scripts/package_release.py installer dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-part-installer
          path: dist/install-chuli-windows.ps1
          if-no-files-found: error
          overwrite: true
      - name: Check synthetic Python fixture tests
        shell: bash
        run: |
          (cd evals/fixtures/loans && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
          (cd evals/fixtures/importer && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Validate manifests, skills, and agents on Windows
        run: python tests/validate_repository.py
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem scripts/*.ps1,tests/*.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Error $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Dry-run, install, verify, rollback and update
        shell: pwsh
        run: ./tests/windows-smoke.ps1
      - name: Regression tests for TOML, personalization and rollback
        shell: pwsh
        run: ./tests/windows-regression.ps1
      - name: TTP resources installation, preservation and rollback
        shell: pwsh
        run: ./tests/windows-ttp-resources.ps1
      - name: TTP resources compatibility with Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-ttp-resources.ps1
      - name: Manager command installer in PowerShell 7
        shell: pwsh
        run: ./tests/windows-manager-install.ps1
      - name: Manager command installer in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-manager-install.ps1
      - name: Multi-client installation, presets and rollback (Codex, Claude, AGY)
        shell: pwsh
        run: ./tests/windows-multiclient.ps1

  chuli-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.x"
          check-latest: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check pinned Go dependencies
        run: go mod tidy -diff
      - name: Check Go source formatting
        shell: bash
        run: |
          dirty=$(gofmt -l cmd/chuli internal/manager internal/tui internal/eval internal/integrations)
          if [[ -n "$dirty" ]]; then
            echo "$dirty"
            exit 1
          fi
      - name: Vet Go packages
        run: go vet ./...
      - name: Test Chuli
        run: go test ./...
      - name: Validate evaluation catalog from CLI
        run: go run ./cmd/chuli eval check
      - name: Check Python fixtures on every platform
        shell: bash
        run: |
          (cd evals/fixtures/loans && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
          (cd evals/fixtures/importer && PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v)
      - name: Build, run and package native Chuli Manager
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          goos=$(go env GOOS)
          goarch=$(go env GOARCH)
          binary=chuli
          if [[ "$goos" == "windows" ]]; then binary=chuli.exe; fi
          CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-X main.version=$version" -o "$binary" ./cmd/chuli
          "./$binary" version | grep -F "$version"
          "./$binary" --source . eval check
          GOBIN="$RUNNER_TEMP/gobin" go install ./cmd/chuli
          "$RUNNER_TEMP/gobin/$binary" version
          python scripts/package_release.py manager dist --binary "$binary" --goos "$goos" --goarch "$goarch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-part-manager-${{ runner.os }}
          path: dist/chuli_v*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release-candidate:
    needs: [structure, windows-installer, chuli-go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-part-*
          merge-multiple: true
          digest-mismatch: error
          path: dist
      - name: Prepare and verify checksums for the candidate
        run: python scripts/verify_release.py "$(cat VERSION)" dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: candidate
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Record the candidate for human approval
        env:
          ARTIFACT_ID: ${{ steps.candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.candidate.outputs.artifact-digest }}
        run: |
          printf '### Candidato de entrega\n\n- Run %s\n- Commit %s\n- ID del artefacto %s\n- SHA-256 del artefacto %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
