name: Publish authorized Chuli v0.2.0

# One-time publication authorization: project owner approved v0.2.0
# after the evaluation/TTP validation and explicit integration/publication request.
on:
  workflow_run:
    workflows: ["Validate harness"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: publish-chuli-v0.2.0
  cancel-in-progress: false

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.name == 'Validate harness' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exactly validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify authorization, version and current main SHA
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$VALIDATED_SHA"
          test "$(git rev-parse origin/main)" = "$VALIDATED_SHA"
          if [ "$(tr -d '\r\n' < VERSION)" != "0.2.0" ]; then
            echo "One-time v0.2.0 publisher: another version, skipping."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(tr -d '\r\n' < VERSION)" = "0.2.0"
          test -f docs/releases/v0.2.0.md
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.2.0 already exists; skipping."
            echo "create=false" >> "$GITHUB_OUTPUT"
          else
            if git show-ref --verify --quiet refs/tags/v0.2.0; then
              test "$(git rev-parse 'refs/tags/v0.2.0^{commit}')" = "$VALIDATED_SHA"
            fi
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.gate.outputs.create == 'true'
        with:
          go-version: "1.26"

      - name: Test and build official executables
        if: steps.gate.outputs.create == 'true'
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy -diff
          go test ./...
          mkdir -p dist/build-windows dist/build-linux dist/build-macos dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags='-X main.version=0.2.0' -trimpath -buildvcs=false -o dist/build-windows/chuli.exe ./cmd/chuli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags='-X main.version=0.2.0' -trimpath -buildvcs=false -o dist/build-linux/chuli ./cmd/chuli
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags='-X main.version=0.2.0' -trimpath -buildvcs=false -o dist/build-macos/chuli ./cmd/chuli
          (cd dist/build-windows && zip -q ../chuli_v0.2.0_windows_amd64.zip chuli.exe)
          tar -C dist/build-linux -czf dist/chuli_v0.2.0_linux_amd64.tar.gz chuli
          tar -C dist/build-macos -czf dist/chuli_v0.2.0_darwin_arm64.tar.gz chuli
          unzip -t dist/chuli_v0.2.0_windows_amd64.zip
          tar -tzf dist/chuli_v0.2.0_linux_amd64.tar.gz
          tar -tzf dist/chuli_v0.2.0_darwin_arm64.tar.gz
          (cd dist && sha256sum chuli_v0.2.0_*.zip chuli_v0.2.0_*.tar.gz > SHA256SUMS.txt)

      - name: Publish official release with artifacts
        if: steps.gate.outputs.create == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$VALIDATED_SHA"
          if ! git show-ref --verify --quiet refs/tags/v0.2.0; then
            git tag v0.2.0 "$VALIDATED_SHA"
            git push origin refs/tags/v0.2.0
          fi
          test "$(git rev-parse 'refs/tags/v0.2.0^{commit}')" = "$VALIDATED_SHA"
          gh release create v0.2.0 \
            dist/chuli_v0.2.0_windows_amd64.zip \
            dist/chuli_v0.2.0_linux_amd64.tar.gz \
            dist/chuli_v0.2.0_darwin_arm64.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VALIDATED_SHA" \
            --verify-tag \
            --title "Chuli v0.2.0 — Evaluación y recursos TTP" \
            --notes-file docs/releases/v0.2.0.md \
            --latest
